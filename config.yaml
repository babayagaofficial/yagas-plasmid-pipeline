#set exactly one of input_list and multifasta, and leave the other empty
input_list: "some_plasmids.txt" #list of plasmid fasta files

multifasta: "" #single fasta file containing all plasmids

output_dir: "out" #output directory

chr_to_plasmid: "chr_to_plasmid.tsv" #tsv which relates plasmid IDs to chromosomal IDs

host_tree: "host_tree.nw" #chromosomal tree for determining relevant host clades, in Newick format

dcj-indel: 4

containment: 0.5

pling_other_cli: "--batch_size 1000"

#optional: use existing results instead of running pling and/or MOB-typer; leave empty ("") to run them
#external_pling_dir is the output directory of `pling cluster align`, run with the dcj-indel and containment set above
external_pling_dir: ""
#external_mobtyper is a `mob_typer --multi` results file, with sample_id matching the plasmid IDs
external_mobtyper: ""

big_subcomm_size: 10

#analyses to run; steps an enabled analysis depends on (e.g. pling, MOB-typer, ggCallaroo) are run automatically
analyses:
  dcj_distr: True       #distribution of all DCJ-Indel distances
  boundary: True        #DCJ-Indel distances on subcommunity boundaries vs within subcommunities
  dcj_trees: True       #DCJ-Indel matrices and NJ trees per subcommunity
  cluster_specs: True   #MOB-typer summary per subcommunity
  #per-subcommunity analyses, for subcommunities larger than big_subcomm_size
  ggcallaroo: True      #annotated pangenomes
  rel_core: True        #relative core genome sizes (runs ggcallaroo)
  pangraph: True        #pangenome graphs
  parsnp: True          #core genome alignments
  phylofactor: True     #enriched host clades (needs chr_to_plasmid and host_tree)

ggcaller_cli_args: "--save"

panaroo_cli_args: "--clean-mode moderate"

bakta_db: "/path/to/bakta_db"

#slurm resources per rule; runtime is in minutes and mem_mb in MB
#mem_mb and runtime are multiplied by the attempt number when a job is retried, threads are not
#rules not listed here use the default values
resources:
  default:          {mem_mb: 4000,  runtime: 60,  threads: 1}
  pling:            {mem_mb: 32000, runtime: 720, threads: 16}
  mobtyper:         {mem_mb: 8000,  runtime: 240, threads: 1}
  ggcallaroo_ggcaller:        {mem_mb: 32000, runtime: 720, threads: 8}
  ggcallaroo_panaroo:         {mem_mb: 16000, runtime: 240, threads: 8}
  ggcallaroo_bakta_proteins:  {mem_mb: 16000, runtime: 240, threads: 8}
  pangraph:         {mem_mb: 40000, runtime: 240, threads: 8}
  parsnp:           {mem_mb: 40000, runtime: 240, threads: 16}
  phylofactor:      {mem_mb: 20000, runtime: 120, threads: 1}
